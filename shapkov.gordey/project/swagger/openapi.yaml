openapi: 3.0.3
info:
  title: Gadget Hub
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /login:
    post:
      summary: Аутентификация пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: {type: string, example: 'user'}
                password: {type: string, example: 'password'}
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: {type: string}
                  username: {type: string}
        '401':
          description: Неверные данные
  /logout:
    post:
      summary: Завершение сессии
      responses:
        '200': {description: Успешный выход}
  /goods:
    get:
      summary: Получить список всех товаров
      responses:
        '200':
          description: Массив товаров
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: integer}
                    name: {type: string}
                    price: {type: number}
                    category: {type: string}
                    color: {type: string}
                    labels: {type: array, items: {type: string}}
                    image: {type: string}
  /orders:
    get:
      summary: Получить историю заказов
      responses:
        '200':
          description: Массив заказов
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      summary: Создать новый заказ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items: {type: array}
                total: {type: number}
                phone: {type: string}
                delivery: {type: boolean}
                address: {type: string}
      responses:
        '201': {description: Заказ создан}
